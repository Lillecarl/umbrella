[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umbrella"
version = "0.1.0"
description = "Drive an umbrella git repo whose submodules are git colocated jj repos"
requires-python = ">=3.11"
dependencies = ["pygit2"]

[project.scripts]
umbrella = "umbrella.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umbrella"]
